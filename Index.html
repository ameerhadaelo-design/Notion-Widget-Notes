<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: Arial, sans-serif;
    }

    .notes-widget {
        width: 100%;
        min-height: 260px;
        padding: 18px;
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .title {
        font-size: 20px;
        font-weight: 600;
        color: #222;
        margin-bottom: 12px;
    }

    textarea {
        width: 100%;
        height: 190px;
        padding: 12px;
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        outline: none;
        resize: vertical;
        font-family: inherit;
        font-size: 14px;
        color: #333;
        background: #fafafa;
    }

    textarea:focus {
        border-color: #aaa;
        background: #fff;
    }
</style>
</head>

<body>

<div class="notes-widget">
    <div class="title">Notes</div>

    <textarea
        id="notes"
        placeholder="Write your notes here..."
    ></textarea>
</div>

<script>
    const notes = document.getElementById("notes");

    notes.value = localStorage.getItem("notionNotes") || "";

    notes.addEventListener("input", () => {
        localStorage.setItem("notionNotes", notes.value);
    });
</script>

</body>
</html>
